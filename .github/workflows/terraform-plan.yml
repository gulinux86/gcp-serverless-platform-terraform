name: terraform-plan

# Plan as read-only feedback:
#   - on PRs to develop/main (env inferred from the base branch), posted as a
#     PR comment so you review the diff before deploying;
#   - on demand via workflow_dispatch, where you pick the environment.
#
# Credential-free checks (fmt + validate) ALWAYS run. The real plan needs GCP
# auth (Workload Identity Federation); when WIF is not configured yet, the plan
# is skipped with a clear message instead of failing the PR.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        options: [hml, prod]

permissions:
  contents: read
  id-token: write # OIDC -> Workload Identity Federation
  pull-requests: write # post the plan comment (PR runs only)

concurrency:
  group: tf-plan-${{ github.event.pull_request.number || github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [foundation, workload]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"

      # Credential-free gate — runs regardless of WIF being configured.
      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # Manual dispatch -> chosen environment; PR -> inferred from base branch.
      # Also resolves env-specific auth/secrets and sets `configured` = whether a
      # WIF provider secret exists for this environment.
      - name: Select environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.base_ref }}" = "main" ]; then
            ENV="prod"
          else
            ENV="hml"
          fi
          echo "ENV_NAME=$ENV" >> "$GITHUB_ENV"
          if [ "$ENV" = "prod" ]; then
            WIF='${{ secrets.PROD_WIF_PROVIDER }}'; SA='${{ secrets.PROD_DEPLOYER_SA }}'
            echo "TF_VAR_db_password=${{ secrets.PROD_DB_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TF_VAR_api_secret_key=${{ secrets.PROD_API_SECRET_KEY }}" >> "$GITHUB_ENV"
          else
            WIF='${{ secrets.HML_WIF_PROVIDER }}'; SA='${{ secrets.HML_DEPLOYER_SA }}'
            echo "TF_VAR_db_password=${{ secrets.HML_DB_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TF_VAR_api_secret_key=${{ secrets.HML_API_SECRET_KEY }}" >> "$GITHUB_ENV"
          fi
          echo "WIF_PROVIDER=$WIF" >> "$GITHUB_ENV"
          echo "DEPLOYER_SA=$SA" >> "$GITHUB_ENV"
          if [ -n "$WIF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP (Workload Identity Federation)
        if: steps.env.outputs.configured == 'true'
        uses: google-github-actions/auth@v2 # TODO: pin to a commit SHA
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        if: steps.env.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2 # TODO: pin to a commit SHA

      - name: Terraform plan (or credential-free validate)
        id: plan
        run: |
          set +e
          LAYER="${{ matrix.layer }}"

          # WIF not configured -> credential-free fmt+validate already cover syntax.
          # Run validate (no backend) and skip the real plan with a clear message.
          if [ "${{ steps.env.outputs.configured }}" != "true" ]; then
            terraform -chdir="$LAYER" init -backend=false -input=false > /tmp/vo.txt 2>&1
            terraform -chdir="$LAYER" validate >> /tmp/vo.txt 2>&1
            RC=$?
            {
              echo "Plan skipped — Workload Identity Federation is not configured for '${ENV_NAME}'."
              echo "Set the ${ENV_NAME^^}_WIF_PROVIDER / ${ENV_NAME^^}_DEPLOYER_SA secrets (run bootstrap/) to enable real plans."
              echo
              echo "Credential-free checks (terraform validate, -backend=false):"
              echo
              cat /tmp/vo.txt
            } > /tmp/plan_output.txt
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "exitcode=$RC" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Configured: real init against the per-env backend.
          if ! terraform -chdir="$LAYER" init -input=false \
              -backend-config="environments/${ENV_NAME}/backend.hcl" > /tmp/plan_output.txt 2>&1; then
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "exitcode=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Greenfield/torn-down guard: the workload layer reads foundation's
          # remote state. Skip the workload plan when foundation has no outputs
          # for this env (never applied, or destroyed -> empty state).
          if [ "$LAYER" = "workload" ]; then
            HCL="foundation/environments/${ENV_NAME}/backend.hcl"
            BUCKET=$(sed -nE 's/^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$HCL")
            PREFIX=$(sed -nE 's/^[[:space:]]*prefix[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$HCL")
            FOUNDATION_OUTPUTS=$(gcloud storage cat "gs://$BUCKET/$PREFIX/default.tfstate" 2>/dev/null | jq -r '.outputs | length' 2>/dev/null || echo 0)
            if [ "${FOUNDATION_OUTPUTS:-0}" = "0" ]; then
              {
                echo "Skipped: foundation layer has no outputs for '${ENV_NAME}' yet."
                echo "Apply the foundation layer first (terraform-deploy -> layer: foundation), then re-run."
              } > /tmp/plan_output.txt
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              echo "exitcode=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          terraform -chdir="$LAYER" validate >> /tmp/plan_output.txt 2>&1
          terraform -chdir="$LAYER" plan -no-color -input=false \
            -var-file="environments/${ENV_NAME}/terraform.tfvars" \
            > /tmp/plan_output.txt 2>&1
          echo "status=plan" >> "$GITHUB_OUTPUT"
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const layer = '${{ matrix.layer }}';
            const code = '${{ steps.plan.outputs.exitcode }}';
            const status = '${{ steps.plan.outputs.status }}';
            const tag = `<!-- tf-plan-bot-${layer} -->`;
            let plan = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            // exit 0 = no changes, 2 = changes (both fine), 1 = error.
            const icon = status === 'skipped' ? '⏭️' : (code !== '1' ? '✅' : '❌');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `${tag}\n## ${icon} Terraform Plan — \`${layer}\` (${process.env.ENV_NAME})\n\n<details><summary>Show output</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Show output (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: cat /tmp/plan_output.txt

      - name: Fail on error
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "terraform plan/validate failed:" >&2
          cat /tmp/plan_output.txt >&2
          exit 1
