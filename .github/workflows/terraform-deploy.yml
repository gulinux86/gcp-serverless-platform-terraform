name: terraform-deploy

# Manual, controlled deploys: you pick the environment and layer when you run it.
# Nothing applies automatically on merge. PROD is gated by the `prod` GitHub
# Environment (required reviewer). Apply always uses a saved plan.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [hml, prod]
      layer:
        description: "Which layer(s) to apply"
        required: true
        default: workload
        type: choice
        options: [foundation, workload, both]

permissions:
  contents: read
  id-token: write # OIDC -> Workload Identity Federation

jobs:
  # Gate 1 — module unit tests. Mocked providers (command = plan), no GCP creds,
  # no infra, env/layer-agnostic. A failure blocks the apply.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # credential-free
    strategy:
      fail-fast: true
      matrix:
        module:
          - modules/foundation/vpc
          - modules/foundation/cloud_firewall
          - modules/workload/cloud_armor
          - modules/workload/cloud_run_service
          - modules/workload/https_load_balancer
          - modules/workload/iam_service_account
          - modules/workload/cloud_sql
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"

      - name: Terraform fmt
        run: terraform fmt -check -recursive ${{ matrix.module }}

      - name: Terraform test
        run: |
          terraform -chdir=${{ matrix.module }} init -input=false -backend=false
          terraform -chdir=${{ matrix.module }} test -no-color

  # Gate 2 — Trivy IaC misconfiguration scan. Fails on HIGH/CRITICAL using the
  # committed .trivyignore. Hard pre-apply gate (no SARIF upload here).
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Trivy config scan (gate)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  deploy:
    needs: [test, security] # apply only after both gates pass
    runs-on: ubuntu-latest
    # Ties to the GitHub Environment: `prod` carries the required reviewer, so a
    # prod run pauses for approval before this job starts.
    environment: ${{ github.event.inputs.environment }}
    # Never run two applies for the same env at once; never cancel one mid-apply.
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Select environment auth
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "WIF_PROVIDER=${{ secrets.PROD_WIF_PROVIDER }}" >> "$GITHUB_ENV"
            echo "DEPLOYER_SA=${{ secrets.PROD_DEPLOYER_SA }}" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.PROD_DB_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TF_VAR_api_secret_key=${{ secrets.PROD_API_SECRET_KEY }}" >> "$GITHUB_ENV"
          else
            echo "WIF_PROVIDER=${{ secrets.HML_WIF_PROVIDER }}" >> "$GITHUB_ENV"
            echo "DEPLOYER_SA=${{ secrets.HML_DEPLOYER_SA }}" >> "$GITHUB_ENV"
            echo "TF_VAR_db_password=${{ secrets.HML_DB_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TF_VAR_api_secret_key=${{ secrets.HML_API_SECRET_KEY }}" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2 # TODO: pin to a commit SHA
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"

      - name: Resolve layers
        run: |
          # "both" must apply foundation BEFORE workload (workload reads its state).
          if [ "${{ github.event.inputs.layer }}" = "both" ]; then
            echo "LAYERS=foundation workload" >> "$GITHUB_ENV"
          else
            echo "LAYERS=${{ github.event.inputs.layer }}" >> "$GITHUB_ENV"
          fi

      - name: Apply (saved plan per layer)
        run: |
          set -euo pipefail
          for L in $LAYERS; do
            echo "::group::terraform $L ($ENVIRONMENT)"
            terraform -chdir="$L" init -input=false \
              -backend-config="environments/${ENVIRONMENT}/backend.hcl"
            # plan -out then apply the saved plan — never re-plan at apply time.
            terraform -chdir="$L" plan -input=false -out=tfplan \
              -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
            terraform -chdir="$L" apply -input=false -auto-approve tfplan
            echo "::endgroup::"
          done
