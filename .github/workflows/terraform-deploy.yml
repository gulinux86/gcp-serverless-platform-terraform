name: terraform-deploy

# Manual, controlled deploys: you pick the environment and layer when you run it.
# Nothing applies automatically on merge. PROD is still gated by the `prod`
# GitHub Environment (required reviewer). Apply always uses a saved plan.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [hml, prod]
      layer:
        description: "Which layer(s) to apply"
        required: true
        default: both
        type: choice
        options: [foundation, workload, both]

permissions:
  contents: read
  id-token: write # OIDC -> Workload Identity Federation
  # Granted because the security gate calls a reusable workflow that declares it. A
  # called workflow cannot hold a permission its caller lacks — omitting this
  # rejects the whole run at validation, with `startup_failure` and no log. The gate
  # passes `upload-sarif: false`, so nothing here actually writes to code scanning.
  security-events: write

jobs:
  # Gate 1 — module unit tests and the layer contract, both credential-free.
  # Calls the same workflow the pull-request check calls, rather than repeating
  # its steps, so the gate and the check cannot drift apart.
  test:
    uses: ./.github/workflows/_terraform-test.yml
    with:
      contract-script: ./scripts/check-layer-contract.sh

  # Gate 1b — formatting and validity of the layer roots, credential-free.
  # The module suites only `fmt` the modules that have tests, so foundation/*.tf
  # and workload/*.tf would otherwise reach the apply step unchecked.
  validate:
    uses: ./.github/workflows/_terraform-validate.yml
    with:
      layers: '["foundation", "workload"]'

  # Gate 2 — Trivy IaC scan, the same workflow the pull-request check calls.
  # SARIF upload is off here on purpose: code scanning results belong to a pull
  # request, and a deploy is not one. This is a hard pre-apply gate, nothing more.
  security:
    uses: ./.github/workflows/_security-scan.yml
    with:
      upload-sarif: false

  deploy:
    needs: [test, validate, security] # apply only after every gate passes
    runs-on: ubuntu-latest
    # Ties to the GitHub Environment: `prod` carries the required reviewer, so a
    # prod run pauses for approval before this job starts. It is also what puts
    # the `environment` claim in the OIDC token — the only token the deployer SA
    # accepts (bootstrap/main.tf).
    environment: ${{ github.event.inputs.environment }}
    # Never run two applies for the same env at once; never cancel one mid-apply.
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      LAYER_INPUT: ${{ github.event.inputs.layer }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to GCP and install Terraform
        uses: ./.github/actions/gcp-terraform-setup
        with:
          role: deploy
          terraform-version: "1.17.2"
          workload-identity-provider: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_WIF_PROVIDER || secrets.HML_WIF_PROVIDER }}
          deploy-service-account: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_WIF_SA || secrets.HML_WIF_SA }}

      - name: Resolve layers
        run: |
          # "both" must apply foundation BEFORE workload (workload reads its state,
          # and installs Argo CD into the cluster foundation creates).
          if [ "$LAYER_INPUT" = "both" ]; then
            echo "LAYERS=foundation workload" >> "$GITHUB_ENV"
          else
            echo "LAYERS=$LAYER_INPUT" >> "$GITHUB_ENV"
          fi

      - name: Apply (saved plan per layer)
        # Secrets reach the script as env vars, never interpolated into its text.
        env:
          TF_VAR_project_id: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_PROJECT_ID || secrets.HML_PROJECT_ID }}
          TF_VAR_db_password: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_DB_PASSWORD || secrets.HML_DB_PASSWORD }}
          TF_VAR_api_secret_key: ${{ env.ENVIRONMENT == 'prod' && secrets.PROD_API_SECRET_KEY || secrets.HML_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          for L in $LAYERS; do
            echo "::group::terraform $L ($ENVIRONMENT)"
            terraform -chdir="$L" init -input=false \
              -backend-config="environments/${ENVIRONMENT}/backend.hcl"
            # plan -out then apply the saved plan — never re-plan at apply time.
            terraform -chdir="$L" plan -input=false -out=tfplan \
              -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
            terraform -chdir="$L" apply -input=false -auto-approve tfplan
            echo "::endgroup::"
          done

      # Where to look next. Argo CD is not exposed, so the summary carries the
      # commands rather than a URL.
      - name: Summary
        if: contains(env.LAYERS, 'workload')
        run: |
          {
            echo "### ${ENVIRONMENT}: platform handed over to Argo CD"
            echo
            echo '```'
            terraform -chdir=foundation output -raw get_credentials_command 2>/dev/null || true
            echo
            terraform -chdir=workload output -raw argocd_port_forward_command
            echo
            echo "Gateway static IP name:  $(terraform -chdir=workload output -raw gateway_address_name)"
            echo "Cloud Armor policy name: $(terraform -chdir=workload output -raw cloud_armor_policy_name)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
