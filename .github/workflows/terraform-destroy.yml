name: terraform-destroy

# Manual, controlled teardown: you pick the environment and layer when you run it.
# Destructive — gated by a typed confirmation and, for PROD, by the `prod` GitHub
# Environment (required reviewer). Shares the `terraform-<env>` concurrency group
# with terraform-deploy so a destroy can never overlap an apply for the same env.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [hml, prod]
      layer:
        description: "Which layer(s) to destroy"
        required: true
        default: workload
        type: choice
        options: [foundation, workload, both]
      confirm:
        description: "Type the environment name (hml/prod) to confirm destroy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC -> Workload Identity Federation

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Ties to the GitHub Environment: `prod` carries the required reviewer, so a
    # prod run pauses for approval before this job starts.
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Confirm destroy
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "$ENVIRONMENT" ]; then
            echo "Confirmation '${{ github.event.inputs.confirm }}' does not match environment '$ENVIRONMENT'. Aborting." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Select environment auth
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "WIF_PROVIDER=${{ secrets.PROD_WIF_PROVIDER }}" >> "$GITHUB_ENV"
            echo "DEPLOYER_SA=${{ secrets.PROD_WIF_SA }}" >> "$GITHUB_ENV"
            PID='${{ secrets.PROD_PROJECT_ID }}'
            echo "TF_VAR_db_password=${{ secrets.PROD_DB_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TF_VAR_api_secret_key=${{ secrets.PROD_API_SECRET_KEY }}" >> "$GITHUB_ENV"
          else
            echo "WIF_PROVIDER=${{ secrets.HML_WIF_PROVIDER }}" >> "$GITHUB_ENV"
            echo "DEPLOYER_SA=${{ secrets.HML_WIF_SA }}" >> "$GITHUB_ENV"
            PID='${{ secrets.HML_PROJECT_ID }}'
            echo "TF_VAR_db_password=${{ secrets.HML_DB_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TF_VAR_api_secret_key=${{ secrets.HML_API_SECRET_KEY }}" >> "$GITHUB_ENV"
          fi
          # project_id via secret (masked). State bucket name is non-secret (backend.hcl).
          echo "TF_VAR_project_id=$PID" >> "$GITHUB_ENV"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2 # TODO: pin to a commit SHA
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      # Needed by the serverless IP-release gate in the Destroy step.
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2 # TODO: pin to a commit SHA

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"

      - name: Resolve layers
        run: |
          # "both" must destroy workload BEFORE foundation (reverse of apply):
          # workload depends on foundation's state and on live network resources.
          if [ "${{ github.event.inputs.layer }}" = "both" ]; then
            echo "LAYERS=workload foundation" >> "$GITHUB_ENV"
          else
            echo "LAYERS=${{ github.event.inputs.layer }}" >> "$GITHUB_ENV"
          fi

      - name: Destroy
        run: |
          set -euo pipefail

          REGION=$(sed -nE 's/^[[:space:]]*region[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            "foundation/environments/${ENVIRONMENT}/terraform.tfvars")
          REGION="${REGION:-us-central1}"

          # Serverless IP-release gate.
          #
          # Cloud Run's Direct VPC Egress leaves behind a compute address with
          # purpose=SERVERLESS, held by serverless.googleapis.com through an
          # addressReservation. That reservation has no user, has no public API,
          # and CANNOT be deleted — `gcloud compute addresses delete` is rejected
          # while it exists. It blocks deletion of the private subnet, failing the
          # foundation destroy with:
          #
          #   The subnetwork resource '...' is already being used by
          #   'projects/.../addresses/serverless-ipv4-...'
          #
          # Google releases it asynchronously with no documented upper bound, so
          # the only correct behaviour is to wait and report progress rather than
          # guess with a fixed sleep.
          #
          # Timeout sizing, from one measured teardown (2026-08-11):
          #   reservation created 19:42Z, released 21:49Z — 2h07 total, and at
          #   least 1h20 after the last Cloud Run service was deleted.
          # A 30- and then a 60-minute timeout were both tried and both would have
          # failed a perfectly healthy teardown. 120 minutes leaves margin over the
          # only sample available; there is no published SLA to size against.
          #
          # Nothing is billed while waiting — the leftover foundation resources
          # (VPC, subnet, PSA range, peering) are free, so a long wait or a re-run
          # tomorrow costs nothing.
          # Runbook: docs/runbooks/serverless-ipv4-reservation.md
          wait_for_serverless_release() {
            local deadline=$(( SECONDS + 7200 )) # 120 min
            local left
            while :; do
              left=$(gcloud compute addresses list \
                --regions="$REGION" --filter="purpose=SERVERLESS" \
                --format="value(name)" | wc -l)

              if [ "$left" -eq 0 ]; then
                echo "No serverless IP reservations left in ${REGION}."
                return 0
              fi

              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::${left} serverless IP reservation(s) still held in ${REGION} after 120 minutes."
                gcloud compute addresses list --regions="$REGION" --filter="purpose=SERVERLESS"
                echo "These are released by Google and cannot be deleted manually."
                echo "Re-run this workflow with layer: foundation once they are gone."
                return 1
              fi

              echo "Waiting for ${left} serverless IP reservation(s) in ${REGION} — $(( SECONDS / 60 ))m elapsed."
              sleep 60
            done
          }

          for L in $LAYERS; do
            # Gate only guards the foundation: it owns the subnet the reservation
            # pins. Destroying workload alone is unaffected.
            if [ "$L" = "foundation" ]; then
              echo "::group::wait for serverless IP release ($REGION)"
              wait_for_serverless_release
              echo "::endgroup::"
            fi

            echo "::group::terraform destroy $L ($ENVIRONMENT)"
            terraform -chdir="$L" init -input=false \
              -backend-config="environments/${ENVIRONMENT}/backend.hcl"
            terraform -chdir="$L" destroy -auto-approve -input=false \
              -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
            echo "::endgroup::"
          done
