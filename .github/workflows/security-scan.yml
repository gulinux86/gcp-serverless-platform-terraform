name: security-scan

# IaC misconfiguration scanning with Trivy as a PR gate. Runs in `config` mode
# over the Terraform code, fails on HIGH/CRITICAL findings, and uploads SARIF so
# results appear under the repository's Security tab. Reviewed exceptions live in
# the committed `.trivyignore`. Cloud-agnostic — no GCP credentials needed.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".trivyignore"
      - ".github/workflows/security-scan.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # First pass: generate SARIF for the Security tab. soft-fail so a finding
      # never blocks the upload step that surfaces it.
      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif

      # Second pass: enforce the gate. exit-code 1 fails the PR on HIGH/CRITICAL.
      - name: Trivy config scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"
