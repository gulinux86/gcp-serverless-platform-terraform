# GCP counterpart of gulinux86/ci-templates' aws-terraform-setup: authenticate to
# Google Cloud through Workload Identity Federation and install Terraform.
#
# The code that decides WHICH identity a job assumes lives here once, instead of
# in each workflow. Two copies can receive a fix separately, and the failure mode
# is a job holding the wrong credential rather than an error.
#
# Two identities, as in eks-terraform's plan/deploy roles:
#   plan   — read-only SA. Impersonable by any workflow of the repository,
#            pull requests included.
#   deploy — write SA. Impersonable only by a job that declares
#            `environment: <env>` (bootstrap/main.tf), so it is gated by the
#            Environment's protection rules, not by this action.
#
# Candidate for upstreaming to gulinux86/ci-templates next to the AWS action.
name: gcp-terraform-setup
description: Authenticate to GCP with Workload Identity Federation and install Terraform (and optionally kubectl).

inputs:
  role:
    description: plan | deploy
    required: true
  workload-identity-provider:
    description: Full WIF provider resource name (bootstrap output workload_identity_provider).
    required: true
  plan-service-account:
    description: Read-only SA email. Required when role=plan.
    required: false
    default: ""
  deploy-service-account:
    description: Deployer SA email. Required when role=deploy.
    required: false
    default: ""
  terraform-version:
    description: Exact Terraform version.
    required: true
  install-kubectl:
    description: Also install kubectl and gke-gcloud-auth-plugin (cluster drain in terraform-destroy).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Fail before authenticating with an empty identity — google-github-actions/auth
    # would otherwise report a confusing token-exchange error.
    - name: Resolve service account
      id: sa
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        PLAN_SA: ${{ inputs.plan-service-account }}
        DEPLOY_SA: ${{ inputs.deploy-service-account }}
        PROVIDER: ${{ inputs.workload-identity-provider }}
      run: |
        set -euo pipefail
        case "$ROLE" in
          plan)   SA="$PLAN_SA" ;;
          deploy) SA="$DEPLOY_SA" ;;
          *) echo "role must be plan or deploy, got '$ROLE'" >&2; exit 1 ;;
        esac
        [ -n "$PROVIDER" ] || { echo "workload-identity-provider is empty — run bootstrap/ and set the <ENV>_WIF_PROVIDER secret" >&2; exit 1; }
        [ -n "$SA" ] || { echo "no service account for role '$ROLE' — set the <ENV>_PLAN_SA / <ENV>_WIF_SA secret" >&2; exit 1; }
        echo "email=$SA" >> "$GITHUB_OUTPUT"

    - name: Authenticate to GCP (Workload Identity Federation)
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ steps.sa.outputs.email }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      with:
        install_components: ${{ inputs.install-kubectl == 'true' && 'gke-gcloud-auth-plugin,kubectl' || '' }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
