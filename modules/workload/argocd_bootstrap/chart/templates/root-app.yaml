# The root Application — the only one Terraform applies.
#
# It watches one directory of the platform repository. Every component is an
# Application (or ApplicationSet) in that directory, so adding one to the cluster
# becomes adding a file and committing: Argo CD reconciles the rest. This is the
# whole point of app-of-apps, and the reason Terraform's involvement ends here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ .Release.Namespace }}
  # The finalizer makes deletion cascade: removing the root tells Argo CD to
  # delete every child Application and the resources they own — including the
  # Gateway, whose deletion is what makes the GKE Gateway controller remove the
  # load balancer it created.
  #
  # The cascade only works while Argo CD and the Gateway controller are both
  # alive, which is why terraform-destroy.yml drains the cluster before
  # `terraform destroy` uninstalls Argo CD. The two only work as a pair.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: {{ .Values.platformRepoUrl | quote }}
    targetRevision: {{ .Values.platformRepoRevision | quote }}
    path: {{ .Values.platformRepoPath | quote }}
    directory:
      # The directory holds Applications only. Recursing would pull in
      # component manifests as raw resources and apply them twice — once here
      # and once through their own Application.
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}

  syncPolicy:
    automated:
      # prune removes children whose file was deleted; selfHeal reverts manual
      # kubectl edits. Together they make Git the only way to change the cluster —
      # which is the property GitOps is actually for.
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
